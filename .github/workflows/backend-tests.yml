name: Foundation backend and frontend tests

on:
  pull_request:
    branches:
      - testing
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - testing
    paths:
      - "backend/**"
      - "frontend/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create development environment file
        run: cp .env.example .env

      - name: Run isolated API and PostgreSQL tests
        run: docker compose --profile test run --rm --build backend_test

      - name: Clean test containers
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
